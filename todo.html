  /* ---- 导出 PNG ---- */
  async function exportPNG() {
    if (typeof html2canvas !== 'function') { showToast('html2canvas 未加载'); return; }
    var orig = exportMenu.classList.contains('open');
    exportMenu.classList.remove('open');
    document.body.classList.add('exporting');
    // 短暂等待渲染
    await new Promise(function (r) { requestAnimationFrame(function () { setTimeout(r, 350); }); });

    var target = document.querySelector('.page');
    var fullW = Math.max(target.scrollWidth, target.offsetWidth);
    var fullH = Math.max(target.scrollHeight, target.offsetHeight);

    try {
      var canvas = await html2canvas(target, {
        scale: 2, useCORS: true,
        backgroundColor: document.body.classList.contains('dark-mode') || root.getAttribute('data-theme') === 'dark' ? '#06080f' : '#f7f8fa',
        width: fullW, height: fullH,
        windowWidth: fullW, windowHeight: fullH,
        scrollX: 0, scrollY: 0,
        onclone: function (cd) {
          cd.querySelectorAll('.shub-widget, .shub-widget-tip, .modal, .bulk-bar, .toast, .export-menu, .task-actions, .icon-btn, .view-tabs, .filter-bar, .date-bar').forEach(function (el) { el.remove(); });
        }
      });
      var title = 'todo-' + todayKey();
      downloadCanvas(canvas, title + '.png');
      showToast('已导出图片 (' + canvas.width + '×' + canvas.height + ')', 'ok');
    } catch (e) {
      console.error(e);
      showToast('导出图片失败：' + (e.message || '未知错误'));
    } finally {
      document.body.classList.remove('exporting');
      if (orig) exportMenu.classList.add('open');
    }
  }

  function downloadCanvas(canvas, filename) {
    var a = document.createElement('a');
    a.download = filename;
    a.href = canvas.toDataURL('image/png');
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---- 导出 Markdown ---- */
  function exportMarkdown() {
    if (!tasks.length) { showToast('没有任务可导出'); return; }
    var md = '# 待办清单 · ' + todayKey() + '\n\n';
    // 统计
    var total = tasks.length, done = tasks.filter(function (t) { return t.done; }).length;
    md += '> ' + done + ' / ' + total + ' 已完成（' + Math.round(done / total * 100) + '%）\n\n';
    // 按分组
    var sorted = tasks.slice().sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (a.date && b.date) return a.date.localeCompare(b.date);
      if (a.date) return -1; if (b.date) return 1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    var grouped = groupTasks(sorted);
    grouped.forEach(function (g) {
      md += '## ' + g.label + '\n\n';
      g.tasks.forEach(function (t) {
        var prefix = t.done ? '- [x] ' : '- [ ] ';
        var line = prefix + t.text;
        var meta = [];
        if (t.date && !t.done) meta.push('📅 ' + t.date);
        if (t.startTime && t.endTime) meta.push('🕐 ' + t.startTime + '–' + t.endTime);
        if (t.repeat && t.repeat !== 'none') meta.push('🔄 ' + repeatLabel(t.repeat));
        if (t.remindMinutes !== null && t.remindMinutes !== undefined && t.remindMinutes !== '') meta.push('🔔 ' + remindLabel(t.remindMinutes));
        if (t.priority === 'high') meta.push('🔥高');
        else if (t.priority === 'low') meta.push('低');
        if (t.starred) meta.push('⭐');
        if ((t.tags || []).length) meta.push(t.tags.map(function (x) { return '#' + x; }).join(' '));
        if (meta.length) line += '  `' + meta.join(' ') + '`';
        md += line + '\n';
        // 子任务
        (t.subtasks || []).forEach(function (s) {
          md += '  - ' + (s.done ? '[x] ' : '[ ] ') + s.text + '\n';
        });
      });
      md += '\n';
    });
    md += '\n---\n\n_由 Study Hub Todo 导出 · ' + new Date().toLocaleString('zh-CN') + '_\n';
    downloadBlob(md, 'todo-' + todayKey() + '.md', 'text/markdown;charset=utf-8');
    showToast('已导出 Markdown', 'ok');
  }

  /* ---- 导出 ICS（日历） ---- */
  function exportICS() {
    var withDate = tasks.filter(function (t) { return t.date; });
    if (!withDate.length) { showToast('没有带日期的任务，无法导出日历'); return; }
    function padz(n) { return String(n).padStart(2, '0'); }
    function fmtDT(dateStr, timeStr) {
      // 本地时间格式：YYYYMMDDTHHMMSS
      var d = new Date(dateStr + 'T' + (timeStr || '00:00') + ':00');
      return d.getFullYear() + padz(d.getMonth() + 1) + padz(d.getDate()) + 'T' +
             padz(d.getHours()) + padz(d.getMinutes()) + padz(d.getSeconds());
    }
    function fmtD(dateStr) {
      var d = new Date(dateStr + 'T00:00:00');
      return d.getFullYear() + padz(d.getMonth() + 1) + padz(d.getDate());
    }
    function icsEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/,/g, '\\,').replace(/;/g, '\\;').replace(/\n/g, '\\n'); }

    var out = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Study Hub//Todo//CN\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n';
    var now = new Date();
    var stamp = now.getUTCFullYear() + padz(now.getUTCMonth() + 1) + padz(now.getUTCDate()) + 'T' +
                padz(now.getUTCHours()) + padz(now.getUTCMinutes()) + padz(now.getUTCSeconds()) + 'Z';

    withDate.forEach(function (t) {
      out += 'BEGIN:VEVENT\r\n';
      out += 'UID:' + t.id + '@study-hub.local\r\n';
      out += 'DTSTAMP:' + stamp + '\r\n';
      if (t.startTime && t.endTime) {
        out += 'DTSTART:' + fmtDT(t.date, t.startTime) + '\r\n';
        out += 'DTEND:' + fmtDT(t.date, t.endTime) + '\r\n';
      } else {
        // 全天事件
        out += 'DTSTART;VALUE=DATE:' + fmtD(t.date) + '\r\n';
        var nextD = new Date(t.date + 'T00:00:00'); nextD.setDate(nextD.getDate() + 1);
        out += 'DTEND;VALUE=DATE:' + fmtD(fmtDateKey(nextD)) + '\r\n';
      }
      out += 'SUMMARY:' + icsEsc(t.text) + '\r\n';
      var desc = [];
      if (t.priority === 'high') desc.push('优先级：高');
      else if (t.priority === 'low') desc.push('优先级：低');
      if (t.starred) desc.push('⭐ 星标');
      if ((t.tags || []).length) desc.push('标签：' + t.tags.join(', '));
      if ((t.subtasks || []).length) {
        desc.push('子任务：');
        t.subtasks.forEach(function (s) { desc.push('  ' + (s.done ? '☑' : '☐') + ' ' + s.text); });
      }
      desc.push('状态：' + (t.done ? '已完成' : '进行中'));
      if (desc.length) out += 'DESCRIPTION:' + icsEsc(desc.join('\n')) + '\r\n';
      if (t.repeat && t.repeat !== 'none') {
        var rule = { daily: 'FREQ=DAILY', weekdays: 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly: 'FREQ=WEEKLY', monthly: 'FREQ=MONTHLY' }[t.repeat];
        if (rule) out += 'RRULE:' + rule + '\r\n';
      }
      if (t.remindMinutes !== null && t.remindMinutes !== undefined && t.remindMinutes !== '') {
        out += 'BEGIN:VALARM\r\nTRIGGER:-PT' + t.remindMinutes + 'M\r\nACTION:DISPLAY\r\nDESCRIPTION:' + icsEsc(t.text) + '\r\nEND:VALARM\r\n';
      }
      out += 'STATUS:' + (t.done ? 'COMPLETED' : 'CONFIRMED') + '\r\n';
      out += 'END:VEVENT\r\n';
    });
    out += 'END:VCALENDAR\r\n';
    downloadBlob(out, 'todo-' + todayKey() + '.ics', 'text/calendar;charset=utf-8');
    showToast('已导出日历（' + withDate.length + ' 个事件）', 'ok');
  }

    downloadBlob(JSON.stringify(data, null, 2), 'todo-backup-' + todayKey() + '.json', 'application/json');

  /* ---- 导入 JSON ---- */
  function importJSON() {
    var input = document.getElementById('importFileInput');
    input.value = '';
    input.onchange = function (e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        try {
          var parsed = JSON.parse(ev.target.result);
          var incoming = Array.isArray(parsed) ? parsed : (parsed.tasks || []);
          if (!Array.isArray(incoming) || !incoming.length) { showToast('文件中没有任务'); return; }
          if (!confirm('将导入 ' + incoming.length + ' 个任务。\n\n· 确定 = 追加到现有任务\n· 取消 = 放弃导入')) return;
          var n = 0;
          incoming.forEach(function (t) {
            if (!t.text) return;
            tasks.push({
              id: t.id || uid(),
              text: String(t.text).slice(0, 300),
              done: !!t.done,
              priority: t.priority || 'medium',
              date: t.date || null,
              startTime: t.startTime || null,
              endTime: t.endTime || null,
              repeat: t.repeat || 'none',
              remindMinutes: (t.remindMinutes === undefined) ? null : t.remindMinutes,
              starred: !!t.starred,
              tags: Array.isArray(t.tags) ? t.tags : [],
              subtasks: Array.isArray(t.subtasks) ? t.subtasks : [],
              createdAt: t.createdAt || Date.now(),
              completedAt: t.completedAt || null
            });
            n++;
          });
          save(); render();
          showToast('已导入 ' + n + ' 项', 'ok');
        } catch (err) {
          showToast('解析失败：' + err.message);
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  function downloadBlob(content, filename, mime) {
    var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  /* ═══════════════════════════════════════════════════════
     ═══ 提醒 ═══
     ═══════════════════════════════════════════════════════ */
  function checkReminders() {
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    var now = Date.now();
    var today = todayKey();
    tasks.forEach(function (t) {
      if (t.done) return;
      if (t.remindMinutes === null || t.remindMinutes === undefined || t.remindMinutes === '') return;
      if (!t.date || !t.startTime) return;
      var taskTime = new Date(t.date + 'T' + t.startTime + ':00').getTime();
      var remindAt = taskTime - (+t.remindMinutes) * 60000;
      var key = t.id + ':' + t.date + ':' + t.startTime;
      if (reminded[key]) return;
      // 如果提醒时间已过 但在 60 秒内 → 触发
      if (remindAt <= now && now - remindAt < 60000) {
        reminded[key] = now;
        saveReminded();
        try {
          var n = new Notification('⏰ ' + t.text, {
            body: (t.remindMinutes === 0 ? '现在开始' : remindLabel(t.remindMinutes) + ' · ' + t.startTime) + (t.tags && t.tags.length ? ' · #' + t.tags[0] : ''),
            tag: key,
            requireInteraction: true,
          });
          n.onclick = function () { window.focus(); openTaskModal(t.id); n.close(); };
        } catch (e) { console.warn('[todo] 通知失败:', e); }
      }
    });
  }
  // 每分钟检查一次
  setInterval(checkReminders, 60000);
  // 页面加载 5 秒后首次检查
  setTimeout(checkReminders, 5000);

  /* 清理旧提醒记录（7 天前） */
  (function cleanupReminded() {
    var now = Date.now();
    var changed = false;
    Object.keys(reminded).forEach(function (k) {
      if (now - reminded[k] > 7 * 86400000) { delete reminded[k]; changed = true; }
    });
    if (changed) saveReminded();
  })();

  /* ═══ 多标签页同步 ═══ */
  window.addEventListener('storage', function (e) {
    if (e.key === STORAGE_KEY) { load(); render(); }
  });

  /* ═══ 初始化 ═══ */
  load();
  render();
  setInterval(function () { if (view === 'day') renderDay(); }, 60000);

})();
</script>
