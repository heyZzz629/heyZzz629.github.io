<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>七上英语语法 · 精讲精练</title>
<style>
:root{
  --bg:#eef2f9; --card:#fff; --text:#1e293b; --text-sub:#64748b;
  --border:#e4e9f2; --border-strong:#cbd5e1;
  --chip:#f2f5fb; --soft:#f8fafc;
  --primary:#6366f1; --primary-soft:#eef0ff;
  --warning:#f59e0b; --success:#10b981; --danger:#ef4444;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.05);
  --shadow-lg:0 12px 28px rgba(16,24,40,.12);
  --radius:14px;
}
[data-theme="dark"]{
  --bg:#0a0f1e; --card:#141b2d; --text:#e6ebf5; --text-sub:#8b96ad;
  --border:#232b42; --border-strong:#3a4460;
  --chip:#1c2438; --soft:#0f1626;
  --primary:#818cf8; --primary-soft:#1e2540;
  --warning:#fbbf24; --success:#34d399; --danger:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.2);
  --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text); min-height:100vh; transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(1200px 600px at 12% -10%, color-mix(in srgb,var(--primary) 8%,transparent), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  overscroll-behavior-y:none;
  padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
}
button,input,select,textarea{font-family:inherit}

/* 顶部 */
header{
  position:sticky; top:0; z-index:50;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(16px) saturate(1.4);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid var(--border);
}
.top-inner{max-width:1440px; margin:0 auto; padding:10px 14px 8px}
.brand{display:flex; align-items:center; gap:10px; margin-bottom:8px}
.logo{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-size:17px; flex-shrink:0; background:linear-gradient(135deg,var(--primary),#8b5cf6); box-shadow:0 4px 12px color-mix(in srgb,var(--primary) 35%,transparent)}
.brand h1{margin:0; font-size:15px; font-weight:700; letter-spacing:.2px}
.brand .sub{margin:2px 0 0; font-size:11px; color:var(--text-sub)}
.icon-btn{margin-left:auto; width:34px; height:34px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; font-size:15px; display:grid; place-items:center; transition:.15s; flex-shrink:0}
.icon-btn:active{transform:scale(.94); background:var(--chip)}
.top-icons{display:flex; gap:6px; margin-left:auto}

.tabs{display:flex; gap:3px; background:var(--chip); padding:3px; border-radius:10px; margin-bottom:8px; width:100%}
.tab{
  flex:1; border:none; background:transparent; color:var(--text-sub);
  font-size:12px; font-weight:700; padding:9px 4px; border-radius:8px;
  cursor:pointer; transition:.18s; font-family:inherit;
  display:inline-flex; align-items:center; justify-content:center; gap:5px;
  white-space:nowrap;
}
.tab:hover{color:var(--text)}
.tab.active{background:var(--card); color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tab .badge{background:var(--danger); color:#fff; font-size:10px; font-weight:800; padding:2px 5px; border-radius:99px; min-width:16px; text-align:center}
.tab .badge[data-zero="true"]{display:none}

/* 工具栏 */
.toolbar{
  display:flex; gap:8px; align-items:center; width:100%;
}
.filter-scroll{
  flex:1; min-width:0; display:flex; gap:6px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:none; padding:2px 0; scroll-behavior:smooth;
}
.filter-scroll::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--border); background:var(--card); color:var(--text-sub);
  font-size:12px; padding:8px 14px; border-radius:99px; cursor:pointer;
  transition:.15s; font-family:inherit; font-weight:600; white-space:nowrap;
  flex-shrink:0;
}
.chip:active{transform:scale(.96)}
.chip.active{background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:0 3px 10px color-mix(in srgb,var(--primary) 38%,transparent)}
.mf-more{
  width:40px; height:36px; border-radius:11px;
  background:var(--card); border:1px solid var(--border); color:var(--text);
  display:grid; place-items:center; cursor:pointer; font-size:16px; flex-shrink:0;
  transition:.15s;
}
.mf-more:active{transform:scale(.94); background:var(--chip)}
.mf-more.on{background:var(--primary); color:#fff; border-color:var(--primary)}

/* 主区域 */
main{max-width:1440px; margin:0 auto; padding:12px 14px 40px}
.view{animation:fadeUp .25s}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* 讲解卡片 */
.notes-grid{display:flex; flex-direction:column; gap:12px}
.note{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 16px 14px 18px; box-shadow:var(--shadow);
  transition:transform .2s;
}
.note:active{transform:scale(.99)}
.note-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:12px}
.note-head h3{margin:0; font-size:14.5px; font-weight:800; line-height:1.4; flex:1}
.note-cat{
  font-size:10px; font-weight:800; letter-spacing:.3px;
  padding:3px 8px; border-radius:5px; white-space:nowrap; flex-shrink:0;
  background:var(--primary-soft); color:var(--primary);
}
.note-points{list-style:none; padding:0; margin:0 0 12px; display:flex; flex-direction:column; gap:6px}
.note-points li{font-size:12.5px; line-height:1.7; padding-left:18px; position:relative}
.note-points li::before{content:'◆'; position:absolute; left:0; top:0; color:var(--primary); font-size:8px; line-height:2.4}
.note-points code{background:var(--chip); padding:2px 5px; border-radius:4px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; color:var(--primary); font-weight:700}
.note-points b{color:var(--text); font-weight:800}
.note-examples{background:var(--soft); border-radius:10px; padding:10px 12px; margin-bottom:10px; display:flex; flex-direction:column; gap:8px}
.note-ex{padding-left:10px; border-left:3px solid var(--primary)}
.note-ex .en{font-family:Georgia,"Times New Roman",serif; font-size:12.5px; font-weight:600; line-height:1.55}
.note-ex .en em{font-style:normal; color:var(--primary); font-weight:800; background:color-mix(in srgb,var(--primary) 12%,transparent); padding:0 3px; border-radius:3px}
.note-ex .cn{font-size:11.5px; color:var(--text-sub); line-height:1.45; margin-top:2px}
.note-tip{font-size:12px; line-height:1.65; color:var(--text-sub); padding:9px 12px; border-radius:9px; background:color-mix(in srgb,var(--warning) 10%,transparent); border-left:3px solid var(--warning)}
.note-tip b{color:var(--warning); font-weight:800}

/* 题目总览方块 */
.q-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(46px,1fr)); gap:6px; padding:6px 0; animation:fadeUp .25s}
.q-square{
  aspect-ratio:1/1; border-radius:10px; cursor:pointer;
  display:grid; place-items:center; font-size:13px; font-weight:900;
  color:#fff; border:1.5px solid transparent;
  transition:transform .15s, box-shadow .15s, background .15s;
  animation:ovIn .3s cubic-bezier(.34,1.3,.64,1) backwards;
  position:relative;
}
@keyframes ovIn{from{opacity:0; transform:scale(.2)} to{opacity:1; transform:scale(1)}}
.q-square:active{transform:scale(.94)}
.q-square[data-st="none"]{background:var(--chip); color:var(--text-sub); border-color:var(--border-strong)}
.q-square[data-st="learning"]{background:var(--warning); color:#fff}
.q-square[data-st="done"]{background:var(--success); color:#fff}
.q-square[data-st="wrong"]{background:var(--danger); color:#fff}
.q-square[data-st="picked"]{background:var(--primary); color:#fff; border-color:color-mix(in srgb,var(--primary) 70%,transparent); box-shadow:0 3px 10px color-mix(in srgb,var(--primary) 40%,transparent)}
.q-square[data-st="picked"]::after{content:'✓'; position:absolute; top:2px; right:4px; font-size:9px; opacity:.9}

/* 图例 */
.ov-legend{
  display:none; gap:10px; align-items:center; flex-wrap:wrap;
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:8px 12px; margin:0 0 10px; font-size:11px; font-weight:700;
  color:var(--text-sub); box-shadow:var(--shadow);
}
.ov-legend.show{display:flex}
.ov-legend .dot{width:10px; height:10px; border-radius:3px; margin-right:5px; display:inline-block; vertical-align:-1px}
.ov-legend .dot.none{background:var(--chip); border:1px solid var(--border-strong)}
.ov-legend .dot.learning{background:var(--warning)}
.ov-legend .dot.done{background:var(--success)}
.ov-legend .dot.wrong{background:var(--danger)}
.ov-legend .dot.picked{background:var(--primary)}
.ov-legend .item{display:inline-flex; align-items:center}
.ov-legend .hint{margin-left:auto; font-size:10.5px; opacity:.65; font-weight:500}

/* 悬浮 */
.ov-tip{position:fixed; pointer-events:none; background:var(--text); color:var(--bg); padding:7px 12px; border-radius:9px; font-size:12px; font-weight:700; white-space:nowrap; opacity:0; transition:opacity .15s; z-index:600; box-shadow:0 8px 24px rgba(0,0,0,.28); transform:translate(-50%,-125%); max-width:280px; overflow:hidden; text-overflow:ellipsis}
.ov-tip.show{opacity:1}

/* 刷题设置 */
.practice-setup{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px 18px; box-shadow:var(--shadow);
}
.practice-setup h2{margin:0 0 6px; font-size:17px; font-weight:800}
.practice-setup .desc{color:var(--text-sub); font-size:12.5px; margin:0 0 20px; line-height:1.6}
.setup-row{display:flex; flex-direction:column; gap:8px; margin-bottom:16px}
.setup-row label{font-size:12px; font-weight:800; color:var(--text-sub)}
.setup-row .chips{display:flex; gap:6px; flex-wrap:wrap}
.setup-actions{display:flex; gap:10px; margin-top:20px; justify-content:center; flex-wrap:wrap}
.mode-toggle{display:flex; gap:4px; background:var(--chip); padding:4px; border-radius:10px; width:100%}
.mode-toggle .mode-btn{
  flex:1; border:none; background:transparent; color:var(--text-sub);
  font-size:12px; font-weight:700; padding:9px 4px; border-radius:8px;
  cursor:pointer; transition:.18s;
}
.mode-toggle .mode-btn.active{background:var(--card); color:var(--text); box-shadow:0 2px 6px rgba(0,0,0,.1)}

/* 做题 */
.playing{display:flex; flex-direction:column; gap:12px}
.play-top{
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; background:var(--card); border:1px solid var(--border);
  border-radius:12px; box-shadow:var(--shadow); flex-wrap:wrap;
}
.play-title{font-size:12px; font-weight:800; color:var(--text-sub); width:100%}
.play-prog{flex:1; min-width:120px}
.play-prog .bar{height:6px; background:var(--chip); border-radius:99px; overflow:hidden; margin-bottom:4px}
.play-prog .bar i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--primary),var(--success)); border-radius:99px; transition:width .4s}
.play-prog .txt{font-size:11px; color:var(--text-sub); font-weight:700; font-variant-numeric:tabular-nums}
.play-score{display:flex; gap:10px; align-items:center; font-size:12px; font-weight:700; color:var(--text-sub)}
.play-score b{font-size:14px; font-variant-numeric:tabular-nums}
.play-score .ok b{color:var(--success)}
.play-score .no b{color:var(--danger)}

.q-card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 16px; box-shadow:var(--shadow);
}
.q-cat{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.3px; padding:3px 9px; border-radius:5px; background:var(--primary-soft); color:var(--primary); margin-bottom:12px}
.q-sentence{font-size:16px; line-height:1.8; font-weight:600; margin-bottom:18px}
.q-sentence .blank{display:inline-block; min-width:72px; padding:0 6px; border-bottom:2px solid var(--primary); margin:0 3px; text-align:center; color:var(--primary); font-weight:800; font-family:Georgia,serif}
.q-sentence .hint{display:inline-block; font-size:11.5px; font-weight:700; color:var(--warning); background:color-mix(in srgb,var(--warning) 12%,transparent); padding:2px 7px; border-radius:5px; margin-left:5px; vertical-align:2px}
.q-options{display:flex; flex-direction:column; gap:8px}
.q-opt{
  display:flex; align-items:center; gap:10px;
  border:2px solid var(--border); background:var(--card); color:var(--text);
  padding:12px 14px; border-radius:11px; cursor:pointer;
  transition:.15s; font-size:14px; font-weight:600; text-align:left; width:100%;
}
.q-opt:active:not(.locked){transform:scale(.985)}
.q-opt .letter{width:24px; height:24px; border-radius:6px; flex-shrink:0; background:var(--chip); display:grid; place-items:center; font-size:11px; font-weight:900; color:var(--text-sub); transition:.15s}
.q-opt .letter-text{flex:1; font-family:Georgia,"Times New Roman",serif}
.q-opt.correct{border-color:var(--success); background:color-mix(in srgb,var(--success) 12%,transparent)}
.q-opt.correct .letter{background:var(--success); color:#fff}
.q-opt.wrong{border-color:var(--danger); background:color-mix(in srgb,var(--danger) 10%,transparent)}
.q-opt.wrong .letter{background:var(--danger); color:#fff}
.q-opt.locked{cursor:default}

.fill-wrap{display:flex; flex-direction:column; gap:8px}
.fill-input{
  width:100%; border:2px solid var(--border); background:var(--bg); color:var(--text);
  padding:13px 16px; border-radius:12px; font-size:17px;
  font-family:Georgia,"Times New Roman",serif; outline:none; transition:.2s;
}
.fill-input:focus{border-color:var(--primary); background:var(--card); box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 14%,transparent)}
.fill-input.ok{border-color:var(--success)}
.fill-input.bad{border-color:var(--danger); animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}}
.fill-submit{padding:13px 20px; background:var(--primary); color:#fff; border:none; border-radius:12px; font-size:14px; font-weight:800; cursor:pointer; transition:.15s; box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 38%,transparent)}
.fill-submit:active{transform:scale(.97)}
.fill-hint{font-size:11px; color:var(--text-sub); margin-top:6px; text-align:center}

.q-explain{margin-top:14px; padding:12px 14px; border-radius:11px; background:var(--soft); border-left:4px solid var(--primary); font-size:12.5px; line-height:1.7; animation:fadeUp .2s}
.q-explain .head{font-weight:800; margin-bottom:6px; font-size:12.5px}
.q-explain.ok .head{color:var(--success)}
.q-explain.bad .head{color:var(--danger)}
.q-explain .body b{color:var(--primary); font-weight:800}
.play-actions{display:flex; justify-content:space-between; gap:8px; margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); flex-wrap:wrap}
.play-actions.right{justify-content:flex-end}
.btn{
  border:1px solid var(--border); background:var(--card); color:var(--text-sub);
  padding:11px 16px; border-radius:11px; font-size:13px; font-weight:700;
  cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:6px;
  justify-content:center; white-space:nowrap; flex:1; min-width:0;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 38%,transparent)}
.btn.danger{color:var(--danger); border-color:color-mix(in srgb,var(--danger) 30%,var(--border))}
.btn.danger-solid{background:var(--danger); color:#fff; border-color:var(--danger)}
.btn.sm{padding:8px 12px; font-size:12px; flex:0 0 auto}
.btn.lg{padding:14px 24px; font-size:14px; flex:1}
.btn:disabled{opacity:.4; cursor:not-allowed}

/* 结果 */
.result{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px 18px; text-align:center; box-shadow:var(--shadow)}
.result-score{font-size:56px; font-weight:900; line-height:1; margin-bottom:8px; background:linear-gradient(135deg,var(--primary),var(--success)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.result-sub{color:var(--text-sub); font-size:13.5px; margin-bottom:6px}
.result-msg{color:var(--text-sub); font-size:12.5px; margin-bottom:20px; line-height:1.5}
.wrong-list-box{display:flex; flex-direction:column; gap:9px; margin:18px 0; text-align:left; max-height:340px; overflow-y:auto}
.wrong-item{background:var(--soft); border-radius:10px; padding:11px 13px; border-left:3px solid var(--danger); font-size:12.5px; line-height:1.6}
.wrong-item .s{font-family:Georgia,serif; font-weight:600; margin-bottom:4px}
.wrong-item .a{color:var(--success); font-weight:800}
.wrong-item .your{color:var(--danger); font-weight:700; margin-left:8px}
.wrong-item .ex{color:var(--text-sub); font-size:11.5px; margin-top:5px; padding-top:5px; border-top:1px dashed var(--border)}
.result-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px}

/* 错题本 */
.wrong-header{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:12px 14px; box-shadow:var(--shadow); margin-bottom:12px;
}
.wrong-info{font-size:13px; font-weight:700; color:var(--text-sub)}
.wrong-info b{color:var(--danger); font-size:17px}
.wrong-actions{display:flex; gap:6px; flex:1; justify-content:flex-end; flex-wrap:wrap}
.checkbox-all{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--text-sub); cursor:pointer; padding:8px 10px; border-radius:9px; background:var(--chip)}
.checkbox-all input{accent-color:var(--primary); width:15px; height:15px}
.wrong-list{display:flex; flex-direction:column; gap:10px}
.wrong-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 14px; box-shadow:var(--shadow); display:flex; gap:10px; align-items:flex-start}
.wrong-card input[type="checkbox"]{margin-top:3px; accent-color:var(--primary); width:16px; height:16px; flex-shrink:0}
.wrong-body{flex:1; min-width:0}
.wrong-card .q-text{font-size:13.5px; line-height:1.65; font-weight:600; margin-bottom:8px}
.wrong-card .q-text .blank{display:inline-block; min-width:52px; padding:0 5px; border-bottom:2px solid var(--primary); margin:0 3px; text-align:center; color:var(--primary); font-weight:800; font-family:Georgia,serif}
.wrong-card .info{display:flex; gap:10px; font-size:11.5px; flex-wrap:wrap; line-height:1.5}
.wrong-card .info .a{color:var(--success); font-weight:800}
.wrong-card .info .your{color:var(--danger); font-weight:700}
.wrong-card .ex{color:var(--text-sub); font-size:11.5px; line-height:1.6; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border)}

.empty{text-align:center; padding:50px 16px; color:var(--text-sub); font-size:13px; line-height:1.6}
.empty .icon{font-size:40px; display:block; margin-bottom:10px; opacity:.5}

/* 组卷 */
.paper-tabs{display:flex; gap:4px; margin-bottom:12px; background:var(--chip); padding:3px; border-radius:10px}
.ptab{flex:1; border:none; background:transparent; color:var(--text-sub); font-size:12.5px; font-weight:700; padding:9px 8px; border-radius:8px; cursor:pointer; transition:.18s}
.ptab.active{background:var(--card); color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.08)}

.paper-list{display:flex; flex-direction:column; gap:10px}
.paper-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 15px; box-shadow:var(--shadow); position:relative}
.paper-card h3{margin:0 0 6px; font-size:14px; font-weight:800; padding-right:30px}
.paper-card .meta{font-size:11.5px; color:var(--text-sub); line-height:1.65}
.paper-card .meta b{color:var(--text); font-weight:800}
.paper-card .score-badge{display:inline-block; padding:2px 6px; border-radius:5px; font-size:10.5px; font-weight:800; margin-left:5px}
.paper-card .score-badge.good{background:color-mix(in srgb,var(--success) 15%,transparent); color:var(--success)}
.paper-card .score-badge.mid{background:color-mix(in srgb,var(--warning) 15%,transparent); color:var(--warning)}
.paper-card .score-badge.bad{background:color-mix(in srgb,var(--danger) 15%,transparent); color:var(--danger)}
.paper-card .ops{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap}
.paper-card .del-icon{
  position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:9px;
  border:none; background:transparent; color:var(--text-sub); cursor:pointer;
  opacity:.5; transition:.15s; font-size:14px;
}
.paper-card .del-icon:active{opacity:1; background:color-mix(in srgb,var(--danger) 10%,transparent); color:var(--danger)}

.new-subtabs{display:flex; gap:4px; margin-bottom:12px; background:var(--card); border:1px solid var(--border); padding:3px; border-radius:11px; box-shadow:var(--shadow)}
.nstab{flex:1; border:none; background:transparent; color:var(--text-sub); font-size:12.5px; font-weight:700; padding:10px 6px; border-radius:8px; cursor:pointer; transition:.18s; display:inline-flex; align-items:center; justify-content:center; gap:5px}
.nstab.active{background:var(--primary); color:#fff; box-shadow:0 2px 8px color-mix(in srgb,var(--primary) 35%,transparent)}

.pick-tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px; box-shadow:var(--shadow); margin-bottom:10px}
.pick-tools .left{display:flex; gap:6px; flex-wrap:wrap; flex:1}
.pick-tools .right{display:flex; gap:6px; align-items:center; flex-wrap:wrap; width:100%; margin-top:6px}
select.nice{border:1px solid var(--border); background:var(--card); color:var(--text); padding:8px 10px; border-radius:99px; font-size:12px; font-weight:600; cursor:pointer; outline:none; flex:1; min-width:120px}

.pick-list{display:flex; flex-direction:column; gap:9px; padding-bottom:90px}
.pick-item{
  background:var(--card); border:1px solid var(--border); border-radius:11px;
  padding:12px 14px; display:flex; gap:10px; align-items:flex-start; cursor:pointer; transition:.15s;
}
.pick-item.selected{border-color:var(--primary); background:color-mix(in srgb,var(--primary) 6%,var(--card)); box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent)}
.pick-item input[type="checkbox"]{margin-top:3px; accent-color:var(--primary); width:16px; height:16px; flex-shrink:0}
.pick-item .q-text{flex:1; font-size:13px; line-height:1.6; font-weight:600}
.pick-item .q-text .blank{display:inline-block; min-width:48px; padding:0 5px; border-bottom:2px solid var(--primary); margin:0 3px; text-align:center; color:var(--primary); font-weight:800; font-family:Georgia,serif}
.pick-item .q-cat-tag{font-size:9.5px; font-weight:800; padding:3px 7px; border-radius:4px; background:var(--chip); color:var(--text-sub); flex-shrink:0; align-self:flex-start}

.pick-bar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--border); padding:12px 14px calc(12px + env(safe-area-inset-bottom, 0px))}
.pick-bar-inner{max-width:1440px; margin:0 auto; display:flex; align-items:center; gap:10px}
.pick-bar .count{font-size:13px; font-weight:700}
.pick-bar .count b{color:var(--primary); font-size:16px}
.pick-bar .spacer{flex:1}

/* 抽屉 */
.sheet{position:fixed; inset:0; z-index:400; display:none; background:rgba(8,12,24,.5); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); align-items:flex-end}
.sheet.show{display:flex; animation:sheetFade .2s}
@keyframes sheetFade{from{opacity:0} to{opacity:1}}
.sheet-panel{
  width:100%; max-height:80vh; background:var(--card);
  border-radius:22px 22px 0 0;
  padding:8px 0 calc(16px + env(safe-area-inset-bottom, 0px));
  box-shadow:0 -20px 60px rgba(0,0,0,.3);
  animation:sheetUp .28s cubic-bezier(.34,1.3,.64,1);
  overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
@keyframes sheetUp{from{transform:translateY(100%)} to{transform:none}}
.sheet-handle{width:38px; height:4px; border-radius:2px; background:var(--border-strong); margin:0 auto 12px}
.sheet-title{font-size:14px; font-weight:800; padding:0 18px 12px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; color:var(--text)}
.sheet-title .cnt{font-size:11.5px; font-weight:600; color:var(--text-sub); margin-left:auto}
.sheet-section{padding:12px 18px 4px}
.sheet-section + .sheet-section{border-top:1px solid var(--border); padding-top:14px; margin-top:8px}
.sheet-section h4{font-size:10.5px; font-weight:800; color:var(--text-sub); margin:0 0 9px; letter-spacing:.5px; text-transform:uppercase}
.sheet-chips{display:flex; gap:6px; flex-wrap:wrap}
.sheet-chips .chip{padding:9px 14px; font-size:12.5px}
.sheet-list{display:flex; flex-direction:column; gap:7px}
.sheet-item{
  width:100%; padding:12px 14px; border-radius:12px;
  background:var(--chip); border:none;
  display:flex; align-items:center; gap:11px;
  font-family:inherit; font-size:13.5px; font-weight:700;
  color:var(--text); cursor:pointer; transition:.15s;
  text-align:left;
}
.sheet-item:active{transform:scale(.985); background:var(--border)}
.sheet-item .ico{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:15px; background:var(--card); flex-shrink:0}
.sheet-item .txt{flex:1; min-width:0}
.sheet-item .txt .sub{font-size:10.5px; font-weight:500; color:var(--text-sub); display:block; margin-top:2px}
.sheet-item.danger{color:var(--danger)}
.sheet-item.danger .ico{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.sheet-item.on{background:var(--primary-soft); color:var(--primary)}
.sheet-item.on .ico{background:var(--primary); color:#fff}

/* 全屏搜索 */
.search-fullscreen{position:fixed; inset:0; z-index:450; display:none; flex-direction:column; background:var(--bg); padding:calc(12px + env(safe-area-inset-top, 0px)) 14px 20px}
.search-fullscreen.show{display:flex; animation:sheetFade .15s}
.search-row{display:flex; gap:8px; align-items:center}
.search-row input{flex:1; border:1px solid var(--border); background:var(--card); color:var(--text); padding:12px 16px; border-radius:12px; font-size:16px; outline:none; transition:.15s}
.search-row input:focus{border-color:var(--primary); box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 14%,transparent)}
.search-row .cancel{padding:12px 16px; background:var(--chip); color:var(--text-sub); border:none; border-radius:12px; font-size:13px; font-weight:700; cursor:pointer; flex-shrink:0}
.search-tip{font-size:11.5px; color:var(--text-sub); margin-top:12px; text-align:center; line-height:1.6}

/* 模态框 */
.modal{position:fixed; inset:0; z-index:500; display:none; place-items:center; padding:14px; background:rgba(8,12,24,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
.modal.show{display:grid; animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.modal-box{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:22px 18px; max-width:100%; width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 28px 70px rgba(0,0,0,.4); animation:modalIn .26s cubic-bezier(.34,1.3,.64,1)}
@keyframes modalIn{from{opacity:0; transform:translateY(20px) scale(.97)} to{opacity:1; transform:none}}
.modal-box h2{margin:0 0 6px; font-size:16px; font-weight:800}
.modal-box p.desc{font-size:13px; color:var(--text-sub); line-height:1.6; margin:0 0 18px}
.field{margin-bottom:12px}
.field label{display:block; font-size:11.5px; font-weight:800; color:var(--text-sub); margin-bottom:5px}
.field input{width:100%; border:1px solid var(--border); background:var(--bg); color:var(--text); padding:12px 14px; border-radius:11px; font-size:15px; outline:none; transition:.15s}
.field input:focus{border-color:var(--primary); background:var(--card); box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 12%,transparent)}
.modal-actions{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}
.modal-actions .btn{flex:1}

.confirm-box{text-align:center; padding:24px 20px 20px}
.confirm-icon{width:50px; height:50px; border-radius:50%; margin:0 auto 12px; display:grid; place-items:center; font-size:22px; background:color-mix(in srgb,var(--warning) 15%,transparent); animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.confirm-box.danger .confirm-icon{background:color-mix(in srgb,var(--danger) 15%,transparent)}
@keyframes pop{0%{transform:scale(.3)} 60%{transform:scale(1.2)} 100%{transform:scale(1)}}
.confirm-box h2{text-align:center; font-size:15.5px}
.confirm-box p.desc{text-align:center; font-size:12.5px}

/* Toast */
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translate(-50%,90px); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:11px; font-size:12.5px; font-weight:700; opacity:0; pointer-events:none; z-index:700; transition:.35s cubic-bezier(.34,1.3,.64,1); box-shadow:0 12px 36px rgba(0,0,0,.28); max-width:86vw; text-align:center; line-height:1.5}
.toast.show{opacity:1; transform:translate(-50%,0)}
.toast.ok{background:var(--success); color:#fff}
.toast.warn{background:var(--warning); color:#fff}
.toast.err{background:var(--danger); color:#fff}

/* 桌面端适配 */
@media (min-width:761px){
  .top-inner{padding:14px 22px 12px}
  .logo{width:40px; height:40px; font-size:20px; border-radius:12px}
  .brand h1{font-size:17px}
  .brand .sub{display:block; font-size:12px}
  .icon-btn{width:38px; height:38px; font-size:16px}
  .tab{font-size:13.5px; padding:9px 16px; flex:0 1 auto}
  .tabs{width:fit-content}
  main{padding:22px}
  .notes-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(440px,1fr)); gap:18px}
  .note{padding:22px 24px}
  .note-head h3{font-size:16px}
  .note-points li{font-size:13.5px; padding-left:22px}
  .note-points li::before{font-size:9px}
  .note-ex .en{font-size:14px}
  .note-ex .cn{font-size:12px}
  .note-tip{font-size:12.5px}
  .practice-setup{max-width:680px; margin:0 auto; padding:32px 30px}
  .q-grid{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
  .playing{max-width:760px; margin:0 auto}
  .result{max-width:760px; margin:0 auto; padding:36px 28px}
  .wrong-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:12px}
  .paper-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px}
  .pick-list{padding-bottom:80px}
  .pick-tools .left{flex:0 1 auto}
  .pick-tools .right{margin-left:auto; width:auto; margin-top:0}
  .mf-more{width:42px}
  .filter-scroll .chip{padding:8px 16px; font-size:12.5px}
}
</style>
</head>
<body>

<header>
  <div class="top-inner">
    <div class="brand">
      <div class="logo">📐</div>
      <div>
        <h1>七上英语语法</h1>
        <p class="sub">讲解 · 刷题 · 错题本 · 组卷</p>
      </div>
      <div class="top-icons">
        <button class="icon-btn" id="mobileSearchBtn" title="搜索">🔍</button>
        <button class="icon-btn" id="themeBtn" title="主题">🌙</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="notes">📖<span> 讲解</span></button>
      <button class="tab" data-tab="practice">✍️<span> 做题</span></button>
      <button class="tab" data-tab="wrong">📕<span> 错题</span><span class="badge" id="wrongBadge" data-zero="true">0</span></button>
      <button class="tab" data-tab="paper">📝<span> 组卷</span></button>
    </div>

    <!-- 讲解工具栏 -->
    <div id="notesTools" class="toolbar">
      <div class="filter-scroll" id="noteFilters">
        <button class="chip active" data-f="all">全部</button>
        <button class="chip" data-f="third">三单</button>
        <button class="chip" data-f="plural">单复数</button>
        <button class="chip" data-f="be">be 动词</button>
        <button class="chip" data-f="pron">代词</button>
        <button class="chip" data-f="tense">时态</button>
        <button class="chip" data-f="other">其他</button>
      </div>
      <button class="mf-more" data-module="notes" title="更多">⚙️</button>
    </div>

    <!-- 做题工具栏 -->
    <div id="practiceTools" class="toolbar" hidden>
      <div class="filter-scroll">
        <button class="chip active" data-f="all">全部</button>
        <button class="chip" data-f="plural">单复数</button>
        <button class="chip" data-f="third">三单</button>
        <button class="chip" data-f="be">be 动词</button>
        <button class="chip" data-f="pron">代词</button>
        <button class="chip" data-f="tense">时态</button>
        <button class="chip" data-f="misc">综合</button>
      </div>
      <button class="mf-more" data-module="practice" title="更多">⚙️</button>
    </div>

    <!-- 错题工具栏 -->
    <div id="wrongTools" class="toolbar" hidden>
      <div class="filter-scroll">
        <span class="chip active" style="cursor:default">错题本</span>
      </div>
      <button class="mf-more" data-module="wrong" title="更多">⚙️</button>
    </div>

    <!-- 组卷工具栏 -->
    <div id="paperTools" class="toolbar" hidden>
      <div class="filter-scroll">
        <span class="chip active" style="cursor:default">试卷管理</span>
      </div>
      <button class="mf-more" data-module="paper" title="更多">⚙️</button>
    </div>
  </div>
</header>

<main>
  <!-- 讲解视图 -->
  <section class="view" id="viewNotes">
    <div class="ov-legend" id="notesLegend" style="background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border:none">
      <span class="item">💡 悬停或点击方块查看</span>
    </div>
    <div class="notes-grid" id="notesGrid"></div>
    <div class="empty" id="notesEmpty" hidden><span class="icon">📖</span>没有匹配的语法点</div>
  </section>

  <!-- 做题视图 -->
  <section class="view" id="viewPractice" hidden>
    <div id="practiceSetup">
      <div class="practice-setup">
        <h2>✍️ 临时做题</h2>
        <p class="desc">临时做题不保存为试卷，做完即走。<br>需要保存的，去「📝 组卷」。</p>

        <div class="setup-row">
          <label>模式</label>
          <div class="mode-toggle" id="practiceModeToggle">
            <button class="mode-btn active" data-mode="choice">📋 选择</button>
            <button class="mode-btn" data-mode="fill">✏️ 填空</button>
            <button class="mode-btn" data-mode="mix">🎲 混合</button>
          </div>
        </div>
        <div class="setup-row">
          <label>题型</label>
          <div class="chips" id="practiceCatChips">
            <button class="chip active" data-cat="all">全部</button>
            <button class="chip" data-cat="plural">单复数</button>
            <button class="chip" data-cat="third">三单</button>
            <button class="chip" data-cat="be">be 动词</button>
            <button class="chip" data-cat="pron">代词</button>
            <button class="chip" data-cat="tense">时态</button>
            <button class="chip" data-cat="misc">综合</button>
          </div>
        </div>
        <div class="setup-row">
          <label>题量</label>
          <div class="chips" id="practiceNumChips">
            <button class="chip" data-num="10">10 题</button>
            <button class="chip active" data-num="20">20 题</button>
            <button class="chip" data-num="30">30 题</button>
            <button class="chip" data-num="50">50 题</button>
            <button class="chip" data-num="all">全部</button>
          </div>
        </div>
        <div class="setup-row">
          <label>顺序</label>
          <div class="chips" id="practiceOrderChips">
            <button class="chip active" data-order="random">随机</button>
            <button class="chip" data-order="seq">按顺序</button>
          </div>
        </div>

        <div class="setup-actions">
          <button class="btn primary lg" id="startPracticeBtn">开始做题 →</button>
        </div>
      </div>
    </div>

    <div class="playing" id="practicePlaying" hidden>
      <div class="play-top">
        <div class="play-title" id="playTitle"></div>
        <div class="play-prog">
          <div class="bar"><i id="playBarFill" style="width:0%"></i></div>
          <div class="txt" id="playProgress">第 0 / 0 题</div>
        </div>
        <div class="play-score">
          <span class="ok">✓ <b id="playRight">0</b></span>
          <span class="no">✗ <b id="playWrong">0</b></span>
        </div>
        <button class="btn sm" id="playOvBtn" title="总览">🔲</button>
      </div>
      <div id="playCardWrap"></div>
      <div id="playQGridWrap" hidden>
        <div class="ov-legend show" style="margin-bottom:10px">
          <span class="item"><span class="dot none"></span>未做</span>
          <span class="item"><span class="dot learning"></span>当前</span>
          <span class="item"><span class="dot done"></span>对</span>
          <span class="item"><span class="dot wrong"></span>错</span>
        </div>
        <div class="q-grid" id="playQGrid"></div>
      </div>
    </div>

    <div id="practiceResult" hidden></div>
  </section>

  <!-- 错题本 -->
  <section class="view" id="viewWrong" hidden>
    <div class="wrong-header">
      <div class="wrong-info">共 <b id="wrongCount">0</b> 道错题</div>
      <div class="wrong-actions">
        <button class="btn sm" id="wrongOvBtn">🔲</button>
        <label class="checkbox-all"><input type="checkbox" id="wrongSelectAll"> 全选</label>
      </div>
    </div>
    <div style="display:none">
      <button id="practiceSelectedWrong"></button>
      <button id="removeSelectedWrong"></button>
      <button id="clearAllWrong"></button>
    </div>
    <div class="ov-legend" id="wrongLegend">
      <span class="item"><span class="dot wrong"></span>错题</span>
      <span class="hint">点击方块查看</span>
    </div>
    <div class="wrong-list" id="wrongListEl"></div>
    <div class="q-grid" id="wrongQGrid" hidden style="padding:0"></div>
    <div class="empty" id="wrongEmpty" hidden><span class="icon">🎉</span>错题本是空的，做几道题去积累吧</div>
  </section>

  <!-- 组卷 -->
  <section class="view" id="viewPaper" hidden>
    <div class="paper-tabs">
      <button class="ptab active" data-ptab="my">📁 我的试卷</button>
      <button class="ptab" data-ptab="new">➕ 新建</button>
    </div>

    <div id="myPapersView">
      <div class="paper-list" id="paperListEl"></div>
      <div class="empty" id="paperEmpty" hidden><span class="icon">📝</span>还没有保存的试卷</div>
    </div>

    <div id="newPaperView" hidden>
      <div class="new-subtabs">
        <button class="nstab active" data-sub="manual">✋ 手动选题</button>
        <button class="nstab" data-sub="cond">⚡ 按条件</button>
      </div>

      <div id="condView" hidden>
        <div class="practice-setup">
          <h2>⚡ 按条件快速组卷</h2>
          <p class="desc">选择题型、题量、顺序，自动抽题生成试卷并保存。</p>
          <div class="setup-row">
            <label>题型</label>
            <div class="chips" id="condCatChips">
              <button class="chip active" data-cat="all">全部</button>
              <button class="chip" data-cat="plural">单复数</button>
              <button class="chip" data-cat="third">三单</button>
              <button class="chip" data-cat="be">be 动词</button>
              <button class="chip" data-cat="pron">代词</button>
              <button class="chip" data-cat="tense">时态</button>
              <button class="chip" data-cat="misc">综合</button>
            </div>
          </div>
          <div class="setup-row">
            <label>题量</label>
            <div class="chips" id="condNumChips">
              <button class="chip" data-num="10">10</button>
              <button class="chip active" data-num="20">20</button>
              <button class="chip" data-num="30">30</button>
              <button class="chip" data-num="50">50</button>
            </div>
          </div>
          <div class="setup-row">
            <label>顺序</label>
            <div class="chips" id="condOrderChips">
              <button class="chip active" data-order="random">随机</button>
              <button class="chip" data-order="seq">按顺序</button>
            </div>
          </div>
          <div class="setup-row">
            <label>模式</label>
            <div class="mode-toggle" id="condModeToggle">
              <button class="mode-btn active" data-mode="choice">📋 选择</button>
              <button class="mode-btn" data-mode="fill">✏️ 填空</button>
              <button class="mode-btn" data-mode="mix">🎲 混合</button>
            </div>
          </div>
          <div class="setup-actions">
            <button class="btn primary lg" id="condGenerateBtn">生成并保存 →</button>
          </div>
        </div>
      </div>

      <div id="manualView">
        <div class="pick-tools">
          <div class="left">
            <button class="btn sm" id="pickAllBtn">全选</button>
            <button class="btn sm" id="pickNoneBtn">全不选</button>
            <button class="btn sm" id="pickInvertBtn">反选</button>
            <button class="btn sm" id="pickToggleViewBtn">🔲</button>
          </div>
          <div class="right">
            <select class="nice" id="pickByCatSelect">
              <option value="">按分类批量选…</option>
              <option value="plural">全选单复数</option>
              <option value="third">全选三单</option>
              <option value="be">全选 be 动词</option>
              <option value="pron">全选代词</option>
              <option value="tense">全选时态</option>
              <option value="misc">全选综合</option>
            </select>
            <button class="btn sm" id="pickSearchBtn">🔍 搜索</button>
          </div>

<script>
/* ============ 工具 ============ */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function load(k,d){try{const r=localStorage.getItem(k);return r?JSON.parse(r):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let toastTimer;
function toast(msg,type){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast show'+(type?' '+type:'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.className='toast'+(type?' '+type:'');},2000);
}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function now(){return Date.now();}
function fmtTime(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function isMobile(){return window.matchMedia('(max-width: 760px)').matches;}

/* ============ 确认/输入弹窗 ============ */
let _confirmResolve=null;
function askConfirm(msg,opts){
  opts=opts||{};
  return new Promise(resolve=>{
    _confirmResolve=resolve;
    const box=document.getElementById('confirmBox');
    box.classList.toggle('danger',!!opts.danger);
    document.getElementById('confirmIcon').textContent=opts.icon||'⚠️';
    document.getElementById('confirmTitle').textContent=opts.title||'确认操作';
    document.getElementById('confirmMsg').innerHTML=msg;
    const ok=document.getElementById('confirmOk');
    ok.textContent=opts.okText||'确定';
    ok.className='btn '+(opts.danger?'danger-solid':'primary');
    document.getElementById('confirmCancel').textContent=opts.cancelText||'取消';
    document.getElementById('confirmModal').classList.add('show');
  });
}
function closeConfirm(r){document.getElementById('confirmModal').classList.remove('show');if(_confirmResolve){_confirmResolve(r);_confirmResolve=null;}}
document.getElementById('confirmOk').addEventListener('click',()=>closeConfirm(true));
document.getElementById('confirmCancel').addEventListener('click',()=>closeConfirm(false));
document.getElementById('confirmModal').addEventListener('click',e=>{if(e.target===document.getElementById('confirmModal'))closeConfirm(false);});

let _promptResolve=null;
function askPrompt(opts){
  opts=opts||{};
  return new Promise(resolve=>{
    _promptResolve=resolve;
    document.getElementById('promptTitle').textContent=opts.title||'请输入';
    document.getElementById('promptMsg').textContent=opts.msg||'';
    const inp=document.getElementById('promptInput');
    inp.value=opts.value||'';
    inp.placeholder=opts.placeholder||'';
    document.getElementById('promptModal').classList.add('show');
    if(!isMobile()) setTimeout(()=>{inp.focus();inp.select();},100);
  });
}
function closePrompt(r){document.getElementById('promptModal').classList.remove('show');if(_promptResolve){_promptResolve(r);_promptResolve=null;}}
document.getElementById('promptOk').addEventListener('click',()=>{const v=document.getElementById('promptInput').value.trim();closePrompt(v||null);});
document.getElementById('promptCancel').addEventListener('click',()=>closePrompt(null));
document.getElementById('promptInput').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value.trim();closePrompt(v||null);}});
document.getElementById('promptModal').addEventListener('click',e=>{if(e.target===document.getElementById('promptModal'))closePrompt(null);});

/* ============ 数据 ============ */

/* ============ 悬浮 ============ */
const ovTip=document.getElementById('ovTip');
function showOvTip(t,s,x,y){
  ovTip.innerHTML=esc(t)+(s?`<span class="sub">${esc(s)}</span>`:'');
  ovTip.style.left=x+'px';ovTip.style.top=y+'px';
  ovTip.classList.add('show');
}
function hideOvTip(){ovTip.classList.remove('show');}
function bindSquare(sq,getTitle,getSub,onClick){
  sq.addEventListener('mouseenter',()=>{
    const r=sq.getBoundingClientRect();
    showOvTip(getTitle(),getSub(),r.left+r.width/2,r.top);
  });
  sq.addEventListener('mousemove',e=>{ovTip.style.left=e.clientX+'px';ovTip.style.top=(e.clientY-12)+'px';});
  sq.addEventListener('mouseleave',hideOvTip);
  sq.addEventListener('click',e=>{e.stopPropagation();hideOvTip();onClick();});
}

  sheetTitle.innerHTML=`<span>${c.title}</span><span class="cnt">${c.cnt}</span>`;
  let html='';
  c.sections.forEach(sec=>{
    if(sec.chips){
      html+=`<div class="sheet-section"><h4>${sec.title}</h4><div class="sheet-chips">`;
      sec.chips.forEach(ch=>{
        html+=`<button class="chip${ch.active?' active':''}">${esc(ch.label)}</button>`;
      });
      html+=`</div></div>`;
    }
    if(sec.items){
      html+=`<div class="sheet-section"><h4>${sec.title}</h4><div class="sheet-list">`;
      sec.items.forEach((it,idx)=>{
        html+=`<button class="sheet-item${it.danger?' danger':''}${it.on?' on':''}" data-idx="${idx}">
          <span class="ico">${it.ico}</span>
          <span class="txt">${it.txt}${it.sub?`<span class="sub">${it.sub}</span>`:''}</span>
        </button>`;
      });
      html+=`</div></div>`;
    }
  });
  sheetBody.innerHTML=html;
  let ci=0;
  c.sections.forEach(sec=>{
    if(sec.chips){
      const chips=sheetBody.querySelectorAll('.chip');
      sec.chips.forEach(ch=>{
        const el=chips[ci++];
        if(el)el.addEventListener('click',()=>{ch.action();});
      });
    }
    if(sec.items){
      sec.items.forEach((it,idx)=>{
        const el=sheetBody.querySelector(`[data-idx="${idx}"]`);
        if(el)el.addEventListener('click',()=>it.action());
      });
    }
  });
}

let noteFilter='all',noteKeyword='';

let practiceCat='all',practiceNum=20,practiceOrder='random',practiceMode='choice';
document.getElementById('practiceModeToggle').addEventListener('click',e=>{
  const btn=e.target.closest('.mode-btn');if(!btn)return;
  practiceMode=btn.dataset.mode;
  document.querySelectorAll('#practiceModeToggle .mode-btn').forEach(b=>b.classList.toggle('active',b===btn));
});
document.getElementById('practiceCatChips').addEventListener('click',e=>{
  const btn=e.target.closest('.chip');if(!btn)return;
  practiceCat=btn.dataset.cat;
  document.querySelectorAll('#practiceCatChips .chip').forEach(c=>c.classList.toggle('active',c===btn));
});
document.getElementById('practiceNumChips').addEventListener('click',e=>{
  const btn=e.target.closest('.chip');if(!btn)return;
  practiceNum=btn.dataset.num==='all'?'all':+btn.dataset.num;
  document.querySelectorAll('#practiceNumChips .chip').forEach(c=>c.classList.toggle('active',c===btn));
});
document.getElementById('practiceOrderChips').addEventListener('click',e=>{
  const btn=e.target.closest('.chip');if(!btn)return;
  practiceOrder=btn.dataset.order;
  document.querySelectorAll('#practiceOrderChips .chip').forEach(c=>c.classList.toggle('active',c===btn));
});
document.getElementById('startPracticeBtn').addEventListener('click',()=>{
  let pool=practiceCat==='all'?QUESTIONS.slice():QUESTIONS.filter(q=>q.cat===practiceCat);
  if(practiceOrder==='random')pool=shuffle(pool);
  const ids=practiceNum==='all'?pool.map(q=>q.id):pool.slice(0,practiceNum).map(q=>q.id);
  if(ids.length<1){toast('没有匹配的题目','warn');return;}
  startSession({type:'practice',title:practiceCat==='all'?'综合练习':CAT_LABEL[practiceCat]+' 练习',qids:ids,mode:practiceMode});

function startSession(opts){
  currentSession={
    type:opts.type,title:opts.title,paperId:opts.paperId||null,
    qids:opts.qids.slice(),idx:0,answers:{},rightCount:0,wrongIds:[],
    mode:opts.mode||'choice',startTime:now()
  };
  save(K.session,currentSession);
  document.getElementById('practiceSetup').hidden=true;
  document.getElementById('practicePlaying').hidden=false;
  document.getElementById('practiceResult').hidden=true;
  document.getElementById('playQGridWrap').hidden=true;
  currentTab='practice';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab==='practice'));
  Object.entries(views).forEach(([k,v])=>v.hidden=(k!=='practice'));
  Object.entries(toolbarIds).forEach(([k,id])=>document.getElementById(id).hidden=(k!=='practice'));
  renderSession();
}
function saveSession(){if(!currentSession)localStorage.removeItem(K.session);else save(K.session,currentSession);}
function renderSession(){
  if(!currentSession)return;
  const s=currentSession;
  if(s.idx>=s.qids.length){renderResult();return;}
  const q=Q_MAP[s.qids[s.idx]];
  if(!q){s.idx++;renderSession();return;}
  document.getElementById('playTitle').textContent=s.title;
  document.getElementById('playBarFill').style.width=(s.idx/s.qids.length*100)+'%';
  document.getElementById('playProgress').textContent=`第 ${s.idx+1} / ${s.qids.length} 题`;
  document.getElementById('playRight').textContent=s.rightCount;
  document.getElementById('playWrong').textContent=s.wrongIds.length;
  const useFill=s.mode==='fill'||(s.mode==='mix'&&Math.random()<0.5);
  s._isFill=useFill;
  const wrap=document.getElementById('playCardWrap');
  if(useFill){
    wrap.innerHTML=`
      <div class="q-card">
        <div class="q-cat">${CAT_LABEL[q.cat]||q.cat} · 填空题</div>
        <div class="q-sentence">${formatQ(q.q)}<span class="hint">（${esc(q.hint||'填空')}）</span></div>
        <div class="fill-wrap">
          <input class="fill-input" id="fillInput" placeholder="输入答案…" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="fill-submit" id="fillSubmit">提交</button>
        </div>
        <div class="fill-hint">💡 提示词已给出，填写正确的形式</div>
        <div id="qFeedback"></div>
        <div class="play-actions">
          <button class="btn" id="playQuit">⏸ 保存并退出</button>
        </div>
      </div>
    `;
    const inp=document.getElementById('fillInput');
    if(!isMobile())inp.focus();
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')submitFillAnswer();});
    document.getElementById('fillSubmit').addEventListener('click',submitFillAnswer);
  }else{
    wrap.innerHTML=`
      <div class="q-card">
        <div class="q-cat">${CAT_LABEL[q.cat]||q.cat}</div>
        <div class="q-sentence">${formatQ(q.q)}</div>
        <div class="q-options" id="qOpts">
          ${q.options.map((opt,i)=>`<button class="q-opt" data-i="${i}"><span class="letter">${'ABCD'[i]}</span><span class="letter-text">${esc(opt)}</span></button>`).join('')}
        </div>
        <div id="qFeedback"></div>
        <div class="play-actions"><button class="btn" id="playQuit">⏸ 保存并退出</button></div>
      </div>
    `;
    document.querySelectorAll('#qOpts .q-opt').forEach(btn=>{
      btn.addEventListener('click',()=>selectAnswer(+btn.dataset.i));
    });
  }
  document.getElementById('playQuit').addEventListener('click',async()=>{
    const ok=await askConfirm('进度已自动保存。',{title:'退出当前练习？',icon:'⏸',okText:'退出',cancelText:'继续'});
    if(ok){currentSession=null;localStorage.removeItem(K.session);backToSetup();}
  });
  if(!document.getElementById('playQGridWrap').hidden)buildPlayGrid();
}
function formatQ(t){return esc(t).replace(/______+/g,'<span class="blank">?</span>');}
function submitFillAnswer(){
  const s=currentSession;if(!s)return;
  if(s.answers[s.qids[s.idx]]!==undefined)return;
  const inp=document.getElementById('fillInput');
  const val=inp.value.trim();
  if(!val){toast('请输入答案','warn');return;}
  const q=Q_MAP[s.qids[s.idx]];
  const correctAns=q.options[q.answer].toLowerCase();
  const isCorrect=val.toLowerCase()===correctAns;
  handleAnswer(isCorrect,val,q);
  inp.classList.add(isCorrect?'ok':'bad');
  inp.disabled=true;
  document.getElementById('fillSubmit').disabled=true;
}
function selectAnswer(idx){
  const s=currentSession;if(!s)return;
  const q=Q_MAP[s.qids[s.idx]];
  if(!q)return;
  if(s.answers[q.id]!==undefined)return;
  const correct=idx===q.answer;
  const btns=document.querySelectorAll('#qOpts .q-opt');
  btns.forEach(b=>b.classList.add('locked'));
  btns.forEach((b,i)=>{
    if(i===q.answer)b.classList.add('correct');
    if(i===idx&&!correct)b.classList.add('wrong');
  });
  handleAnswer(correct,q.options[idx],q,idx);
}
function handleAnswer(correct,userAns,q,chosenIdx){
  const s=currentSession;
  s.answers[q.id]=chosenIdx!==undefined?chosenIdx:userAns;
  if(correct)s.rightCount++;
  else{s.wrongIds.push(q.id);addToWrongBook(q.id,chosenIdx!==undefined?chosenIdx:userAns);}
  saveSession();
  const fb=document.getElementById('qFeedback');
  const isFill=s._isFill;
  fb.innerHTML=`
    <div class="q-explain ${correct?'ok':'bad'}">
      <div class="head">${correct?'✓ 答对了':'✗ 正确答案是 '+(isFill?esc(q.options[q.answer]):'ABCD'[q.answer])}</div>
      <div class="body">${q.explain}</div>
    </div>
    <div class="play-actions right"><button class="btn primary" id="nextQBtn">${s.idx+1>=s.qids.length?'查看结果 →':'下一题 →'}</button></div>
  `;
  document.getElementById('nextQBtn').addEventListener('click',()=>{s.idx++;saveSession();renderSession();});
  document.getElementById('playRight').textContent=s.rightCount;
  document.getElementById('playWrong').textContent=s.wrongIds.length;
}
function buildPlayGrid(){
  const s=currentSession;if(!s)return;
  const grid=document.getElementById('playQGrid');
  grid.innerHTML='';
  s.qids.forEach((qid,i)=>{
    const q=Q_MAP[qid];if(!q)return;
    let st='none';
    if(i<s.idx){st=s.wrongIds.includes(qid)?'wrong':'done';}
    else if(i===s.idx){st='learning';}
    const sq=document.createElement('div');
    sq.className='q-square';sq.dataset.st=st;sq.textContent=i+1;
    sq.style.animationDelay=(i*8)+'ms';
    bindSquare(sq,
      ()=>`第 ${i+1} 题 · ${CAT_LABEL[q.cat]||q.cat}`,
      ()=>q.q.replace(/______+/g,'____'),
      ()=>{
        s.idx=i;saveSession();renderSession();
        document.getElementById('playQGridWrap').hidden=true;
        document.getElementById('playCardWrap').hidden=false;
        document.getElementById('playOvBtn').textContent='🔲';
      }
    );
    grid.appendChild(sq);
  });
}
document.getElementById('playOvBtn').addEventListener('click',()=>{
  const wrap=document.getElementById('playQGridWrap');
  const card=document.getElementById('playCardWrap');
  if(wrap.hidden){
    buildPlayGrid();wrap.hidden=false;card.hidden=true;
    document.getElementById('playOvBtn').textContent='▦';
  }else{
    wrap.hidden=true;card.hidden=false;hideOvTip();
    document.getElementById('playOvBtn').textContent='🔲';
  }
});
function renderResult(){
  const s=currentSession;if(!s)return;
  document.getElementById('practiceSetup').hidden=true;
  document.getElementById('practicePlaying').hidden=true;
  const el=document.getElementById('practiceResult');
  el.hidden=false;
  const total=s.qids.length;
  const pct=total?Math.round(s.rightCount/total*100):0;
  let msg;
  if(pct===100)msg='完美！全对！🎉';
  else if(pct>=80)msg='很棒！再巩固一下错题 💪';
  else if(pct>=60)msg='还行，把错题重做一遍会更牢固 📖';
  else msg='基础需要再夯实 📚';
  if(s.paperId){
    const paper=papers.find(p=>p.id===s.paperId);
    if(paper){paper.lastScore={right:s.rightCount,total,ts:now()};paper.lastWrongIds=s.wrongIds.slice();save(K.papers,papers);}
  }
  const wrongQs=s.wrongIds.map(id=>Q_MAP[id]).filter(Boolean);
  el.innerHTML=`
    <div class="result">
      <div class="result-score">${pct}%</div>
      <div class="result-sub">答对 ${s.rightCount} / ${total} 题</div>
      <div class="result-msg">${msg}</div>
      ${wrongQs.length?`
        <div style="text-align:left;font-weight:800;color:var(--text-sub);font-size:12px;margin-bottom:8px">✗ 本次错题（${wrongQs.length} 道）</div>
        <div class="wrong-list-box">
          ${wrongQs.map(q=>`
            <div class="wrong-item">
              <div class="s">${formatQ(q.q)}</div>
              <div>正确答案：<span class="a">${esc(q.options[q.answer])}</span> <span class="your">你选了：${esc(String(s.answers[q.id]??''))}</span></div>
              <div class="ex">${q.explain}</div>
            </div>
          `).join('')}
        </div>
      `:''}
      <div class="result-actions">
        <button class="btn" id="resultBack">返回</button>
        ${wrongQs.length?`<button class="btn primary" id="resultPracticeWrong">只练错题</button>`:''}
      </div>
    </div>
  `;
  document.getElementById('resultBack').addEventListener('click',()=>{currentSession=null;localStorage.removeItem(K.session);backToSetup();});
  const pw=document.getElementById('resultPracticeWrong');
  if(pw)pw.addEventListener('click',()=>{startSession({type:'practice',title:'错题重做',qids:s.wrongIds.slice(),mode:s.mode});});
}
function backToSetup(){
  document.getElementById('practiceSetup').hidden=false;
  document.getElementById('practicePlaying').hidden=true;
  document.getElementById('practiceResult').hidden=true;
  document.getElementById('playQGridWrap').hidden=true;
}

/* ============ 错题本 ============ */
function addToWrongBook(qid,chosen){
  const item=wrongBook.find(w=>w.id===qid);
  if(item){item.chosen=chosen;item.ts=now();}
  else{wrongBook.push({id:qid,chosen,ts:now()});}
  save(K.wrong,wrongBook);updateWrongBadge();
}
function removeFromWrongBook(qid){
  wrongBook=wrongBook.filter(w=>w.id!==qid);
  save(K.wrong,wrongBook);updateWrongBadge();
}
function updateWrongBadge(){
  const badge=document.getElementById('wrongBadge');
  badge.textContent=wrongBook.length;
  badge.dataset.zero=wrongBook.length===0?'true':'false';
  document.getElementById('wrongCount').textContent=wrongBook.length;
}
let wrongOverview=false;
function renderWrongBook(){
  updateWrongBadge();
  const listEl=document.getElementById('wrongListEl');
  const emptyEl=document.getElementById('wrongEmpty');
  const qGrid=document.getElementById('wrongQGrid');
  listEl.innerHTML='';qGrid.innerHTML='';
  const items=wrongBook.slice().sort((a,b)=>b.ts-a.ts);
  if(!items.length){
    emptyEl.hidden=false;qGrid.hidden=true;listEl.hidden=false;
    document.getElementById('wrongSelectAll').checked=false;
    updateWrongActions();
    return;
  }
  emptyEl.hidden=true;
  items.forEach(item=>{
    const q=Q_MAP[item.id];if(!q)return;
    const card=document.createElement('div');
    card.className='wrong-card';
    const chosenDisplay=typeof item.chosen==='number'?q.options[item.chosen]:item.chosen;
    card.innerHTML=`
      <input type="checkbox" class="wrong-cb" data-id="${q.id}">
      <div class="wrong-body">
        <div class="q-text">${formatQ(q.q)}</div>
        <div class="info">
          <span><b>${CAT_LABEL[q.cat]||q.cat}</b></span>
          <span class="a">✓ ${esc(q.options[q.answer])}</span>
          <span class="your">✗ ${esc(chosenDisplay??'—')}</span>
        </div>
        <div class="ex">${q.explain}</div>
      </div>
    `;
    listEl.appendChild(card);
  });
  document.querySelectorAll('.wrong-cb').forEach(cb=>cb.addEventListener('change',updateWrongActions));
  items.forEach((item,i)=>{
    const q=Q_MAP[item.id];if(!q)return;
    const sq=document.createElement('div');
    sq.className='q-square';sq.dataset.st='wrong';sq.textContent=i+1;
    sq.style.animationDelay=(i*8)+'ms';
    bindSquare(sq,
      ()=>q.q.replace(/______+/g,'____'),
      ()=>`${CAT_LABEL[q.cat]||q.cat} · 正确：${q.options[q.answer]}`,
      ()=>{
        if(!wrongOverview)return;
        toggleWrongOverview();
        const cb=document.querySelector(`.wrong-cb[data-id="${q.id}"]`);
        if(cb)cb.scrollIntoView({behavior:'smooth',block:'center'});
      }
    );
    qGrid.appendChild(sq);
  });
  qGrid.hidden=!wrongOverview;listEl.hidden=wrongOverview;
  updateWrongActions();
}
function toggleWrongOverview(){
  wrongOverview=!wrongOverview;
  document.getElementById('wrongListEl').hidden=wrongOverview;
  document.getElementById('wrongQGrid').hidden=!wrongOverview;
  document.getElementById('wrongLegend').classList.toggle('show',wrongOverview);
  const btn=document.getElementById('wrongOvBtn');
  btn.textContent=wrongOverview?'📋':'🔲';
  if(!wrongOverview)hideOvTip();
}
document.getElementById('wrongOvBtn').addEventListener('click',toggleWrongOverview);
function getSelectedWrongIds(){return[...document.querySelectorAll('.wrong-cb:checked')].map(cb=>cb.dataset.id);}
function updateWrongActions(){
  const ids=getSelectedWrongIds();
  document.getElementById('practiceSelectedWrong').disabled=ids.length===0;
  document.getElementById('removeSelectedWrong').disabled=ids.length===0;
  const all=document.querySelectorAll('.wrong-cb');
  const checked=document.querySelectorAll('.wrong-cb:checked');
  document.getElementById('wrongSelectAll').checked=all.length&&checked.length===all.length;
}
document.getElementById('wrongSelectAll').addEventListener('change',e=>{
  document.querySelectorAll('.wrong-cb').forEach(cb=>cb.checked=e.target.checked);
  updateWrongActions();
});
document.getElementById('practiceSelectedWrong').addEventListener('click',()=>{
  const ids=getSelectedWrongIds();if(!ids.length)return;
  startSession({type:'practice',title:'错题重做',qids:ids,mode:'choice'});
});
document.getElementById('removeSelectedWrong').addEventListener('click',async()=>{
  const ids=getSelectedWrongIds();if(!ids.length)return;
  const ok=await askConfirm(`将移除 <b>${ids.length}</b> 道题。`,{title:'移除选中的错题？',icon:'🗑',okText:'确认',danger:true});
  if(!ok)return;
  ids.forEach(id=>removeFromWrongBook(id));
  renderWrongBook();toast(`已移除 ${ids.length} 道`,'ok');
});
document.getElementById('clearAllWrong').addEventListener('click',async()=>{
  if(!wrongBook.length){toast('错题本是空的','warn');return;}
  const ok=await askConfirm(`将清空 <b>${wrongBook.length}</b> 道错题。`,{title:'清空错题本？',icon:'🧹',okText:'确认',danger:true});
  if(!ok)return;
  wrongBook=[];save(K.wrong,wrongBook);renderWrongBook();toast('已清空','ok');
});

/* ============ 组卷 ============ */
let paperSubTab='my';
let newSubTab='manual';
let pickSearchKey='';
let pickOverview=false;
document.querySelectorAll('.ptab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    paperSubTab=btn.dataset.ptab;
    document.querySelectorAll('.ptab').forEach(b=>b.classList.toggle('active',b===btn));
    renderPaperView();
  });
});
document.querySelectorAll('.nstab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    newSubTab=btn.dataset.sub;
    document.querySelectorAll('.nstab').forEach(b=>b.classList.toggle('active',b===btn));
    renderNewSubView();
  });
});
function renderNewSubView(){
  document.getElementById('condView').hidden=newSubTab!=='cond';
  document.getElementById('manualView').hidden=newSubTab!=='manual';
  document.getElementById('pickBar').hidden=newSubTab!=='manual'||paperSubTab!=='new';
}
function renderPaperView(){
  document.getElementById('myPapersView').hidden=paperSubTab!=='my';
  document.getElementById('newPaperView').hidden=paperSubTab!=='new';
  document.querySelectorAll('.ptab').forEach(b=>b.classList.toggle('active',b.dataset.ptab===paperSubTab));
  if(paperSubTab==='my')renderPaperList();
  else{renderNewSubView();if(newSubTab==='manual')renderPickList();}
}
function renderPaperList(){
  const list=document.getElementById('paperListEl');
  const empty=document.getElementById('paperEmpty');
  list.innerHTML='';
  if(!papers.length){empty.hidden=false;return;}
  empty.hidden=true;
  papers.slice().sort((a,b)=>b.createdAt-a.createdAt).forEach(paper=>{
    const card=document.createElement('div');
    card.className='paper-card';
    const scoreHTML=paper.lastScore?(()=>{
      const pct=Math.round(paper.lastScore.right/paper.lastScore.total*100);
      const cls=pct>=80?'good':pct>=60?'mid':'bad';
      return `<span class="score-badge ${cls}">最近 ${pct}% (${paper.lastScore.right}/${paper.lastScore.total})</span>`;
    })():'<span style="color:var(--text-sub);font-size:10.5px">尚未作答</span>';
    card.innerHTML=`
      <button class="del-icon" title="删除">🗑</button>
      <h3>${esc(paper.name)}</h3>
      <div class="meta">共 <b>${paper.qids.length}</b> 题 · ${fmtTime(paper.createdAt)}<br>${scoreHTML}</div>
      <div class="ops">
        <button class="btn sm primary" data-act="do">▶ 作答</button>
        <button class="btn sm" data-act="view">👁 查看</button>
        <button class="btn sm" data-act="wrong">📕 错题</button>
      </div>
    `;
    card.querySelector('.del-icon').addEventListener('click',async()=>{
      const ok=await askConfirm(`删除「${esc(paper.name)}」？`,{title:'删除试卷',icon:'🗑',okText:'删除',danger:true});
      if(!ok)return;
      papers=papers.filter(p=>p.id!==paper.id);save(K.papers,papers);
      renderPaperList();toast('已删除','ok');
    });
    card.querySelectorAll('.ops button').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const act=btn.dataset.act;
        if(act==='do')startSession({type:'paper',title:paper.name,qids:paper.qids.slice(),paperId:paper.id,mode:paper.mode||'choice'});
        else if(act==='view')showPaperPreview(paper);
        else if(act==='wrong'){
          const ids=paper.lastWrongIds||[];
          if(!ids.length){toast('还没有错题记录','warn');return;}
          startSession({type:'practice',title:paper.name+' · 错题',qids:ids.slice(),mode:'choice'});
        }
      });
    });
    list.appendChild(card);
  });
}
function showPaperPreview(paper){
  const content=document.getElementById('previewContent');
  content.innerHTML=`
    <h2 style="margin:0 0 6px;font-size:16px">${esc(paper.name)}</h2>
    <p class="desc">共 ${paper.qids.length} 题 · ${fmtTime(paper.createdAt)}</p>
    <div style="max-height:55vh;overflow-y:auto;margin:0 -10px;padding:0 10px;">
      ${paper.qids.map((qid,i)=>{
        const q=Q_MAP[qid];if(!q)return '';
        return `<div style="padding:10px 12px;background:var(--soft);border-radius:10px;margin-bottom:8px;font-size:12.5px;line-height:1.6">
          <div style="font-weight:700;margin-bottom:4px">${i+1}. ${formatQ(q.q)}</div>
          <div style="font-size:11.5px;color:var(--text-sub)">${q.options.map((o,j)=>`${'ABCD'[j]}. ${esc(o)}`).join('　')}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="modal-actions">
      <button class="btn" id="previewClose">关闭</button>
      <button class="btn primary" id="previewStart">▶ 开始</button>
    </div>
  `;
  document.getElementById('previewModal').classList.add('show');
  document.getElementById('previewClose').addEventListener('click',()=>document.getElementById('previewModal').classList.remove('show'));
  document.getElementById('previewStart').addEventListener('click',()=>{
    document.getElementById('previewModal').classList.remove('show');
    startSession({type:'paper',title:paper.name,qids:paper.qids.slice(),paperId:paper.id,mode:paper.mode||'choice'});
  });
}
document.getElementById('previewModal').addEventListener('click',e=>{
  if(e.target===document.getElementById('previewModal'))document.getElementById('previewModal').classList.remove('show');
});

/* 按条件 */
let condCat='all',condNum=20,condOrder='random',condMode='choice';
document.getElementById('condCatChips').addEventListener('click',e=>{
  const btn=e.target.closest('.chip');if(!btn)return;
  condCat=btn.dataset.cat;
  document.querySelectorAll('#condCatChips .chip').forEach(c=>c.classList.toggle('active',c===btn));
});
document.getElementById('condNumChips').addEventListener('click',e=>{
  const btn=e.target.closest('.chip');if(!btn)return;
  condNum=+btn.dataset.num;
  document.querySelectorAll('#condNumChips .chip').forEach(c=>c.classList.toggle('active',c===btn));
});
document.getElementById('condOrderChips').addEventListener('click',e=>{
  const btn=e.target.closest('.chip');if(!btn)return;
  condOrder=btn.dataset.order;
  document.querySelectorAll('#condOrderChips .chip').forEach(c=>c.classList.toggle('active',c===btn));
});
document.getElementById('condModeToggle').addEventListener('click',e=>{
  const btn=e.target.closest('.mode-btn');if(!btn)return;
  condMode=btn.dataset.mode;
  document.querySelectorAll('#condModeToggle .mode-btn').forEach(b=>b.classList.toggle('active',b===btn));
});
document.getElementById('condGenerateBtn').addEventListener('click',async()=>{
  let pool=condCat==='all'?QUESTIONS.slice():QUESTIONS.filter(q=>q.cat===condCat);
  if(condOrder==='random')pool=shuffle(pool);
  const qids=pool.slice(0,condNum).map(q=>q.id);
  if(!qids.length){toast('没有匹配的题目','warn');return;}
  const defaultName=`${condCat==='all'?'综合':CAT_LABEL[condCat]} · ${qids.length}题`;
  const name=await askPrompt({title:'给试卷起名',msg:`共 ${qids.length} 道题`,value:defaultName,placeholder:'例如：单复数专项'});
  if(!name)return;
  const paper={id:'paper_'+now(),name,qids,createdAt:now(),lastScore:null,lastWrongIds:[],mode:condMode};
  papers.push(paper);save(K.papers,papers);
  toast(`「${name}」已保存`,'ok');
  paperSubTab='my';
  document.querySelectorAll('.ptab').forEach(b=>b.classList.toggle('active',b.dataset.ptab==='my'));
  renderPaperView();
});

/* 手动选题 */
function renderPickList(){
  const list=document.getElementById('pickListEl');
  const grid=document.getElementById('pickQGrid');
  list.innerHTML='';grid.innerHTML='';
  const visibleQs=[];
  QUESTIONS.forEach(q=>{
    if(pickSearchKey){
      const hay=(q.q+q.options.join(' ')+q.explain).toLowerCase();
      if(!hay.includes(pickSearchKey))return;
    }
    visibleQs.push(q);
  });
  visibleQs.forEach(q=>{
    const item=document.createElement('div');
    item.className='pick-item'+(pickedIds.has(q.id)?' selected':'');
    item.dataset.id=q.id;
    item.innerHTML=`
      <input type="checkbox" ${pickedIds.has(q.id)?'checked':''}>
      <div class="q-text">${formatQ(q.q)}</div>
      <div class="q-cat-tag">${CAT_LABEL[q.cat]||q.cat}</div>
    `;
    item.addEventListener('click',e=>{if(e.target.tagName==='INPUT')return;togglePick(q.id);});
    item.querySelector('input').addEventListener('change',()=>togglePick(q.id));
    list.appendChild(item);
  });
  visibleQs.forEach((q,i)=>{
    const sq=document.createElement('div');
    sq.className='q-square';
    sq.dataset.st=pickedIds.has(q.id)?'picked':'none';
    sq.textContent=i+1;
    sq.style.animationDelay=(i*5)+'ms';
    sq.dataset.qid=q.id;
    bindSquare(sq,
      ()=>`${CAT_LABEL[q.cat]||q.cat}${pickedIds.has(q.id)?' ✓ 已选':' · 点击选中'}`,
      ()=>q.q.replace(/______+/g,'____'),
      ()=>togglePick(q.id)
    );
    grid.appendChild(sq);
  });
  list.hidden=pickOverview;grid.hidden=!pickOverview;
  updatePickBar();
}
function togglePick(qid){
  if(pickedIds.has(qid))pickedIds.delete(qid);
  else pickedIds.add(qid);
  const item=document.querySelector(`.pick-item[data-id="${qid}"]`);
  if(item){
    item.classList.toggle('selected',pickedIds.has(qid));
    const cb=item.querySelector('input');
    if(cb)cb.checked=pickedIds.has(qid);
  }
  const sq=document.querySelector(`.q-square[data-qid="${qid}"]`);
  if(sq)sq.dataset.st=pickedIds.has(qid)?'picked':'none';
  updatePickBar();
}
function updatePickBar(){
  document.getElementById('pickedCount').textContent=pickedIds.size;
  document.getElementById('generatePaperBtn').disabled=pickedIds.size===0;
}
document.getElementById('pickAllBtn').addEventListener('click',()=>{
  QUESTIONS.forEach(q=>{
    if(pickSearchKey){
      const hay=(q.q+q.options.join(' ')+q.explain).toLowerCase();
      if(!hay.includes(pickSearchKey))return;
    }
    pickedIds.add(q.id);
  });
  renderPickList();
});
document.getElementById('pickNoneBtn').addEventListener('click',()=>{pickedIds.clear();renderPickList();});
document.getElementById('pickInvertBtn').addEventListener('click',()=>{
  QUESTIONS.forEach(q=>{
    if(pickSearchKey){
      const hay=(q.q+q.options.join(' ')+q.explain).toLowerCase();
      if(!hay.includes(pickSearchKey))return;
    }
    if(pickedIds.has(q.id))pickedIds.delete(q.id);
    else pickedIds.add(q.id);
  });
  renderPickList();
});
document.getElementById('pickToggleViewBtn').addEventListener('click',e=>{
  pickOverview=!pickOverview;
  e.target.textContent=pickOverview?'📋':'🔲';
  e.target.classList.toggle('primary',pickOverview);
  document.getElementById('pickLegend').classList.toggle('show',pickOverview);
  renderPickList();
  if(!pickOverview)hideOvTip();
});
document.getElementById('pickByCatSelect').addEventListener('change',e=>{
  const cat=e.target.value;if(!cat)return;
  QUESTIONS.filter(q=>q.cat===cat).forEach(q=>pickedIds.add(q.id));
  e.target.value='';
  renderPickList();
  toast(`已选中「${CAT_LABEL[cat]}」全部`,'ok');
});
document.getElementById('pickSearchBtn').addEventListener('click',()=>{
  const q=prompt('搜索题目：');
  if(q!==null){
    pickSearchKey=q.trim().toLowerCase();
    renderPickList();
  }
});
document.getElementById('pickClearSelBtn').addEventListener('click',()=>{
  if(!pickedIds.size)return;
  pickedIds.clear();renderPickList();toast('已清空','ok');
});
document.getElementById('generatePaperBtn').addEventListener('click',async()=>{
  if(!pickedIds.size){toast('请至少选一道题','warn');return;}
  const defaultName=`试卷 ${fmtTime(now()).slice(0,10)} · ${pickedIds.size}题`;
  const name=await askPrompt({title:'给试卷起名',msg:`已选 ${pickedIds.size} 道题`,value:defaultName,placeholder:'例如：单复数专项'});
  if(!name)return;
  const qids=[...pickedIds];
  const paper={id:'paper_'+now(),name,qids,createdAt:now(),lastScore:null,lastWrongIds:[],mode:'choice'};
  papers.push(paper);save(K.papers,papers);
  pickedIds.clear();renderPickList();
  toast(`「${name}」已保存`,'ok');
  paperSubTab='my';
  document.querySelectorAll('.ptab').forEach(b=>b.classList.toggle('active',b.dataset.ptab==='my'));
  renderPaperView();
});

/* 恢复会话 */
async function checkResume(){
  if(!currentSession||!currentSession.qids||!currentSession.qids.length)return;
  if(currentSession.idx>=currentSession.qids.length){currentSession=null;localStorage.removeItem(K.session);return;}
  const total=currentSession.qids.length;
  const answered=Object.keys(currentSession.answers).length;
  const ok=await askConfirm(`上次的练习「${esc(currentSession.title)}」还没做完，已完成 <b>${answered}/${total}</b> 题。`,
    {title:'继续上次的练习？',icon:'⏯',okText:'继续',cancelText:'重新开始'});
  if(ok){
    document.getElementById('practiceSetup').hidden=true;
    document.getElementById('practicePlaying').hidden=false;
    document.getElementById('practiceResult').hidden=true;
    document.getElementById('playQGridWrap').hidden=true;
    currentTab='practice';
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab==='practice'));
    Object.entries(views).forEach(([k,v])=>v.hidden=(k!=='practice'));
    Object.entries(toolbarIds).forEach(([k,id])=>document.getElementById(id).hidden=(k!=='practice'));
    renderSession();
  }else{currentSession=null;localStorage.removeItem(K.session);}
}

/* 主题 */
const themeBtn=document.getElementById('themeBtn');
const savedTheme=localStorage.getItem(K.theme)||'light';
document.documentElement.dataset.theme=savedTheme;
themeBtn.textContent=savedTheme==='dark'?'☀️':'🌙';
themeBtn.addEventListener('click',()=>{
  const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;
  localStorage.setItem(K.theme,next);
  themeBtn.textContent=next==='dark'?'☀️':'🌙';
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.content=next==='dark'?'#0a0f1e':'#6366f1';
});

/* 启动 */
renderNotes();
updateWrongBadge();
renderPaperList();
renderNewSubView();
setTimeout(checkResume,350);
</script>
